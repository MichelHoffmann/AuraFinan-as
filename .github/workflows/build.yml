name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Compilar APK Debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Preparar arquivo de ambiente (.env)
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          elif [ ! -f .env ]; then
            touch .env
          fi

      - name: Preparar chave de assinatura debug.keystore
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Gerando debug.keystore necessária para a compilação..."
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Preparar Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            echo "Gerando gradlew com Gradle 9.3.1..."
            gradle wrapper --gradle-version 9.3.1
          fi
          chmod +x gradlew

      - name: Compilar APK Debug com Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aura-financas-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
